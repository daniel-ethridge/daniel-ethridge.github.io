<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Daniel Ethridge | Audiovascular</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <script>
    MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']]
      }
    };
    </script>
    <script id="MathJax-script"
      src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js">
    </script>
</head>
<body">
  <app-root>
  </app-root>
    <script>
    // Listen for cross-document communication messages coming from the iframe
    window.addEventListener('message', function(event) {
      
      // Safety check: ensure the message structure matches what our Unity iframe sends
      if (event.data && event.data.type === 'ExperimentCompleted') {
        
        const jsonPayloadString = event.data.payload;
        console.log("Sending to email");
        
        // In order to properly test this locally, run netlify dev, not ng serve
        fetch('/.netlify/functions/upload-json', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: jsonPayloadString // Already a structured JSON string from Unity
        })
        .then(response => response.json())
        .then(data => console.log('Netlify Local Function Success:', data))
        .catch(error => console.error('Netlify Local Function Error:', error));
      }
    });
  </script>
</body>
</html>

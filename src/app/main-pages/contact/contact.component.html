<div class="main-background">
    <div class="container">
        <h1 class="text-center">Contact</h1>
        <p class="text-center mb-4">
            <em>Get in touch with the contact form below!</em>
        </p>

        <form (ngSubmit)="sendEmail()" class="mx-auto" style="max-width: 600px;">
            <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input id="name" name="name" type="text" class="form-control" [(ngModel)]="form.name" required>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input id="email" name="email" type="email" class="form-control" [(ngModel)]="form.email" required>
            </div>

            <div class="mb-3">
                <label for="subject" class="form-label">Subject</label>
                <input id="subject" name="subject" type="text" class="form-control" [(ngModel)]="form.subject" required>
            </div>

            <div class="mb-3">
                <label for="message" class="form-label">Message</label>
                <textarea id="message" name="message" class="form-control" rows="5" [(ngModel)]="form.message" required></textarea>
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-primary">Send Message</button>
            </div>
        </form>

        <div class="row mt-5">
            <div class="col-5"></div>
            <div class="col-1 justify-content-center d-flex">
                <a href="https://www.linkedin.com/in/daniel-ethridge1/" target="_blank">
                    <img src="../../../assets/linkedin-logo.png" alt="LinkedIn Logo" width="40" height="40" class="rounded-circle">
                </a>
            </div>
            <div class="col-1 justify-content-center d-flex">
                <a href="https://github.com/daniel-ethridge" target="_blank">
                    <img src="../../../assets/github-logo.jpeg" alt="Github Logo" width="40" height="40" class="rounded-circle">
                </a>
            </div>
            <div class="col-5"></div>
        </div>
    </div>
</div>
